name: Pedir una función
description: Una cosa que te ayudaría en el trabajo
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: Qué quieres hacer
      description: Describe la tarea, no la pantalla. Por ejemplo, "quiero ver el tornado de tres variables".
    validations:
      required: true
  - type: textarea
    attributes:
      label: Por qué te sirve
    validations:
      required: true
  - type: textarea
    attributes:
      label: Cómo lo haces hoy
      description: En Excel, en TreeAge o a mano. Opcional.
